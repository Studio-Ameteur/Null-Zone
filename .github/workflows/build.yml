name: Build NullZone

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW and ALL dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-graphite2
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libdeflate
            mingw-w64-x86_64-winpthreads-git
            mingw-w64-x86_64-xz

      - name: Copy ALL dependencies into project
        shell: msys2 {0}
        run: |
          cp /mingw64/include/SDL2/SDL_ttf.h       SDL2/furto/SDL_ttf.h
          cp /mingw64/include/SDL2/SDL_image.h     SDL2/furto/SDL_image.h
          cp /mingw64/lib/libSDL2_ttf.a            SDL2/lib/libSDL2_ttf.a
          cp /mingw64/lib/libSDL2_image.a          SDL2/lib/libSDL2_image.a
          cp /mingw64/lib/libfreetype.a            SDL2/lib/libfreetype.a
          cp /mingw64/lib/libharfbuzz.a            SDL2/lib/libharfbuzz.a
          cp /mingw64/lib/libgraphite2.a           SDL2/lib/libgraphite2.a
          cp /mingw64/lib/libbrotlidec.a           SDL2/lib/libbrotlidec.a
          cp /mingw64/lib/libbrotlicommon.a        SDL2/lib/libbrotlicommon.a
          cp /mingw64/lib/libbz2.a                 SDL2/lib/libbz2.a
          cp /mingw64/lib/libpng.a                 SDL2/lib/libpng.a
          cp /mingw64/lib/libz.a                   SDL2/lib/libz.a
          cp /mingw64/lib/libjpeg.a                SDL2/lib/libjpeg.a
          cp /mingw64/lib/libtiff.a                SDL2/lib/libtiff.a
          cp /mingw64/lib/liblzma.a                SDL2/lib/liblzma.a
          cp /mingw64/lib/libzstd.a                SDL2/lib/libzstd.a
          cp /mingw64/lib/libdeflate.a             SDL2/lib/libdeflate.a
          cp /mingw64/lib/libwebp.a                SDL2/lib/libwebp.a
          cp /mingw64/lib/libwebpdecoder.a         SDL2/lib/libwebpdecoder.a
          cp /mingw64/lib/libwebpdemux.a           SDL2/lib/libwebpdemux.a
          cp /mingw64/lib/libsharpyuv.a            SDL2/lib/libsharpyuv.a

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=windres \
            -DMINGW=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item build/bin/NullZone.exe release/
          Copy-Item COPYRIGHT.txt release/
          Copy-Item CREDITS.txt release/
          if (Test-Path build/bin/assets) {
            Copy-Item -Recurse build/bin/assets release/assets
          }
          Compress-Archive -Path release/* -DestinationPath NullZone_v0.0.1_win.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullZone_v0.0.1_win
          path: NullZone_v0.0.1_win.zip
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: NullZone_v0.0.1_win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
